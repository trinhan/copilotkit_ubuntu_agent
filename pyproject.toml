[project]
name = "copilotkit_ubuntu_agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "ag-ui-adk>=0.4.2",
    "fastapi>=0.128.0",
    "google-adk>=1.18.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.0.0",
    "pytest>=8.0.0",
    "google-cloud-bigquery>=3.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]


